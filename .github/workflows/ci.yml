name: Tests and dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m unittest discover -v
      - run: python -m pip_audit -r requirements.txt
